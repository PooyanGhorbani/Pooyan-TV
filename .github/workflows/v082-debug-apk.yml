name: Pooyan TV v0.8.2 Debug APK

on:
  push:
    branches:
      - ui/movieland-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v082-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and upload v0.8.2 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v0.8.2 preview APK
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Verify APK identity and compute SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.pooyan.namakadetv.dev082movieland' versionCode='47' versionName='0.8.2'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.2-Movieland-Preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.2-Movieland-Preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK and checksum as a preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.2-Movieland-Preview-APK
          path: |
            dist/Pooyan-TV-v0.8.2-Movieland-Preview.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  hls-playback:
    name: Media3 HLS on Android TV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - name: Generate synthetic HLS test media
        run: |
          mkdir -p app/src/debug/assets/pooyan-test
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -profile:v baseline -g 48 -c:a aac -hls_time 2 -hls_list_size 0 app/src/debug/assets/pooyan-test/index.m3u8
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot
          script: gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pooyan.namakadetv.HlsPlaybackInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movieland-hls-test-results
          path: app/build/outputs/androidTest-results/**
