name: Pooyan TV v0.8.2 Debug APK

on:
  push:
    branches:
      - ui/v082-redesign-artifact
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v082-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and upload v0.8.2 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v0.8.2 preview APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK identity and compute SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.pooyan.namakadetv.dev082' versionCode='47' versionName='0.8.2'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.2-MultiSource-Preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.2-MultiSource-Preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK and checksum as a preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.2-MultiSource-Preview-APK
          path: |
            dist/Pooyan-TV-v0.8.2-MultiSource-Preview.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
