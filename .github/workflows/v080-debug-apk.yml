name: Pooyan TV v0.8.0 Debug APK

on:
  push:
    branches: [ui/v0.8.0-ultimate-cinema]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/v080-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v080-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and upload v0.8.0 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify package and prepare checksum
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='com.pooyan.namakadetv.dev070'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.0-debug.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.0-debug.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.0-debug-APK
          path: |
            dist/Pooyan-TV-v0.8.0-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
