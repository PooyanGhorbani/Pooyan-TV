name: Pooyan TV UI Phase 2 - details validation (no release)

on:
  push:
    branches: [ui/phase2-details]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/ci/**'
      - '.github/workflows/ui-phase2-details.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-phase2-details-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-unit:
    name: Build / JVM / lint / Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker regression tests (no deployment)
        run: node --test resolver-worker/resolver.test.mjs
      - name: Android build, all JVM tests, instrumentation compile and lint
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Save JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-jvm-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore

  android-tv-1080p:
    name: Android TV / tv_1080p / all instrumentation tests + screenshot
    needs: build-lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POOYAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/pooyan-tv-diagnostics
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot
          pre-emulator-launch-script: bash tools/ci/capture-emulator-output.sh
          script: bash tools/ci/run-tv-instrumentation.sh full
      - name: Save Android TV test reports and rendered details screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-tv_1080p-details-preview-and-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/pooyan-tv-diagnostics/**
          if-no-files-found: ignore

  android-tv-logical-720p:
    name: Android TV / tv_1080p AVD / logical 1280x720 / all instrumentation tests
    needs: build-lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POOYAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/pooyan-tv-diagnostics
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot
          pre-emulator-launch-script: bash tools/ci/capture-emulator-output.sh
          script: bash tools/ci/run-tv-instrumentation.sh logical-720
      - name: Save logical 720p test reports and rendered details screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-logical-720p-details-preview-and-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/pooyan-tv-diagnostics/**
          if-no-files-found: ignore

  android-tv-720p-avd-diagnostic:
    name: Android TV / dedicated tv_720p AVD / known open emulator issue
    needs: build-lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POOYAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/pooyan-tv-diagnostics
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot -verbose
          pre-emulator-launch-script: bash tools/ci/capture-emulator-output.sh
          script: bash tools/ci/run-tv-instrumentation.sh dpad-only
      - name: Save dedicated tv_720p AVD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dedicated-tv_720p-open-issue-diagnostics
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/pooyan-tv-diagnostics/**
          if-no-files-found: ignore
