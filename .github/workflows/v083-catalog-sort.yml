name: Pooyan TV v0.8.3 Catalog Sorting Preview
on:
  push:
    branches:
      - ui/catalog-sort-preview
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, unit test, lint
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Verify identity and hash
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.pooyan.namakadetv.dev083catalog' versionCode='48' versionName='0.8.3'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.3-Catalog-Sort-Preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.3-Catalog-Sort-Preview.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.3-Catalog-Sort-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
