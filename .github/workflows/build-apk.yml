name: Build Pooyan TV v0.6.0 Premium Preview
on:
  workflow_dispatch:
  push:
    branches: [dev/v0.6.0-premium]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
concurrency:
  group: pooyan-v060-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests (no deployment)
        run: node --test resolver-worker/resolver.test.mjs
      - name: Offline security and syntax tests
        run: bash scripts/verify-offline.sh
      - name: Build, unit tests and lint
        run: |
          gradle --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease || {
            sleep 15
            gradle --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease
          }
      - name: Public HTTP integration checks (no device playback)
        run: POOYAN_LIVE_CHECK=1 gradle --no-daemon testDebugUnitTest --rerun-tasks
      - name: Package preview (no automatic TV installation)
        run: |
          cp app/build/outputs/apk/release/app-release.apk Pooyan-TV-v0.6.0-premium-preview-r2.apk
          sha256sum Pooyan-TV-v0.6.0-premium-preview-r2.apk > SHA256SUMS-v0.6.0-r2.txt
      - name: Upload preview APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.6.0-Premium-Preview
          path: |
            Pooyan-TV-v0.6.0-premium-preview-r2.apk
            SHA256SUMS-v0.6.0-r2.txt
          if-no-files-found: error
          retention-days: 30
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.6.0-Reports
          path: |
            app/build/reports/lint-results-*
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/live-*.tsv
          if-no-files-found: ignore
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM on CI host
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p app/build/reports/emulator-images
            adb pull /sdcard/Android/data/com.pooyan.namakadetv.preview060/files/emulator-home.png app/build/reports/emulator-images/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pooyan-TV-v0.6.0-Emulator-Reports
          path: |
            app/build/reports/androidTests/**
            app/build/reports/emulator-images/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
  publish:
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pooyan-TV-v0.6.0-Premium-Preview
          path: release
      - name: Publish v0.6.0 only after checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS-v0.6.0-r2.txt
          gh release view v0.6.0 >/dev/null 2>&1 || gh release create v0.6.0 --target "$GITHUB_SHA" --prerelease --title 'Pooyan TV v0.6.0 Preview' --notes-file ../docs/V060_RELEASE_FA.md
          if ! gh release view v0.6.0 --json assets --jq '.assets[].name' | grep -qx Pooyan-TV-v0.6.0-premium-preview-r2.apk; then
            gh release upload v0.6.0 Pooyan-TV-v0.6.0-premium-preview-r2.apk SHA256SUMS-v0.6.0-r2.txt
          fi
