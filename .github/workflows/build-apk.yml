name: Build Pooyan TV v0.5.1 Cinematic Preview
on:
  workflow_dispatch:
  push:
    branches: [dev/v0.5.1-playback]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests (no deployment)
        run: node --test resolver-worker/resolver.test.mjs
      - name: Offline security and syntax tests
        run: bash scripts/verify-offline.sh
      - name: Build, unit tests and lint
        run: |
          gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug || {
            sleep 15
            gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
          }
      - name: Public HTTP integration checks (no device playback)
        run: POOYAN_LIVE_CHECK=1 gradle --no-daemon testDebugUnitTest --rerun-tasks
      - name: Package preview (no automatic TV installation)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pooyan-TV-v0.5.1-cinematic-preview-r3.apk
          sha256sum Pooyan-TV-v0.5.1-cinematic-preview-r3.apk > SHA256SUMS-v0.5.1-r3.txt
      - name: Upload preview APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.5.1-Cinematic-Preview
          path: |
            Pooyan-TV-v0.5.1-cinematic-preview-r3.apk
            SHA256SUMS-v0.5.1-r3.txt
          if-no-files-found: error
          retention-days: 30
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.5.1-Reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/live-*.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish isolated preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.1 >/dev/null 2>&1 || gh release create v0.5.1 --target "$GITHUB_SHA" --prerelease --title 'Pooyan TV v0.5.1 Preview' --notes 'Remote focus, native public source parsing, seek timeline and per-title Continue Watching. See docs/V051_RESULTS_FA.md for tested results and limitations. No Xiaomi device playback claim.'
          if ! gh release view v0.5.1 --json assets --jq '.assets[].name' | grep -qx Pooyan-TV-v0.5.1-cinematic-preview-r3.apk; then
            gh release upload v0.5.1 Pooyan-TV-v0.5.1-cinematic-preview-r3.apk SHA256SUMS-v0.5.1-r3.txt
          fi
