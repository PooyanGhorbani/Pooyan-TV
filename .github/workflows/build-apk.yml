name: Build Pooyan TV v0.2 Preview
on:
  workflow_dispatch:
  push:
    branches: [main, dev/v0.2]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify logic and syntax
        run: bash scripts/verify-offline.sh
      - name: Compile and run Android Lint
        run: gradle --no-daemon --stacktrace assembleDebug lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.2-preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
