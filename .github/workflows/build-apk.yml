name: Build Pooyan TV v0.5.0 Cinematic Preview
on:
  workflow_dispatch:
  push:
    branches: [dev/v0.5.0-cinematic]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests (no deployment)
        run: node --test resolver-worker/resolver.test.mjs
      - name: Offline security and syntax tests
        run: bash scripts/verify-offline.sh
      - name: Build, unit tests and lint
        run: |
          gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug || {
            sleep 15
            gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
          }
      - name: Package preview (no automatic TV installation)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pooyan-TV-v0.5.0-cinematic-preview.apk
          sha256sum Pooyan-TV-v0.5.0-cinematic-preview.apk > SHA256SUMS-v0.5.0.txt
      - name: Upload preview APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.5.0-Cinematic-Preview
          path: |
            Pooyan-TV-v0.5.0-cinematic-preview.apk
            SHA256SUMS-v0.5.0.txt
          if-no-files-found: error
          retention-days: 30
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.5.0-Reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
