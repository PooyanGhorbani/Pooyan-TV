name: Build Pooyan TV FarsiPlex v0.4 Preview
on:
  workflow_dispatch:
  push:
    branches: [main, dev/v0.4-farsiplex]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify offline source and policies
        run: bash scripts/verify-offline.sh
      - name: Compile, unit-test parser, lint
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Upload reports even if checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-FarsiPlex-v0.4-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-FarsiPlex-v0.4-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish v0.4 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pooyan-TV-v0.4-preview.apk
          gh release view v0.4 >/dev/null 2>&1 || gh release create v0.4 --target dev/v0.4-farsiplex --prerelease --title 'Pooyan TV v0.4 FarsiPlex' --notes 'Native FarsiPlex public catalog preview. FarsiPlex playback is not verified. Separate preview package preserves v0.1.'
          gh release upload v0.4 Pooyan-TV-v0.4-preview.apk --clobber
