name: Build Pooyan TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run offline checks
        run: bash scripts/verify-offline.sh
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pooyan-tv-v0.1-debug-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/lint-results-debug.html
      - name: Publish v0.1 prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pooyan-tv-v0.1-debug.apk
          sha256sum pooyan-tv-v0.1-debug.apk > SHA256SUMS.txt
          if ! gh release view v0.1 >/dev/null 2>&1; then
            gh release create v0.1 --prerelease --title "Pooyan TV v0.1" --notes "Installable debug APK. Physical Xiaomi TV testing is documented separately. Debug signatures may change between builds. Never uninstall to bypass a signature mismatch without approval."
          fi
          gh release upload v0.1 pooyan-tv-v0.1-debug.apk SHA256SUMS.txt --clobber
