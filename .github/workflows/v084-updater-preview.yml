name: Pooyan TV v0.8.4 Updater Preview

on:
  push:
    branches:
      - ui/updater-v084
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore optional persistent preview signing key
        shell: bash
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pooyan-preview.jks"
            echo "POOYAN_PREVIEW_SIGNING_STORE_FILE=$RUNNER_TEMP/pooyan-preview.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::No persistent preview keystore: debug-signed APK may not replace previous preview installations.'
          fi
      - name: Build, unit tests and lint
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
          POOYAN_PREVIEW_KEY_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.pooyan.namakadetv.dev083catalog' versionCode='49' versionName='0.8.4'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.4-preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.4-preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.4-Updater-Preview-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
