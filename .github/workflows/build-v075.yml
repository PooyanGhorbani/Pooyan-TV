name: Build Pooyan TV v0.7.5 (premium ultimate)
on:
  push:
    branches: [dev/v0.7.5-premium-ultimate]
    paths:
      - 'app/**'
      - '.github/workflows/build-v075.yml'
      - 'resolver-worker/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pooyan-v075-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests (no deployment and no DeepSeek calls)
        run: node --test resolver-worker/resolver.test.mjs
      - name: Build, JVM tests and lint
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload developer preview (NOT signed for in-place update)
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.7.5-dev-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 20
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.7.5-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore
  emulator:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Android TV test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.7.5-emulator-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
  publish:
    needs: [test, emulator]
    if: github.ref == 'refs/heads/dev/v0.7.5-premium-ultimate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure all four stable signing secrets are present
        env:
          STORE_B64: ${{ secrets.POOYAN_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.POOYAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POOYAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POOYAN_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Stable signing unavailable: stop without publishing.'
            exit 1
          fi
          umask 077
          printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/pooyan-release.jks"
          test -s "$RUNNER_TEMP/pooyan-release.jks"
      - name: Build and validate signed release (same package and key as v0.7.0)
        env:
          POOYAN_SIGNING_STORE_FILE: ${{ runner.temp }}/pooyan-release.jks
          POOYAN_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_KEYSTORE_PASSWORD }}
          POOYAN_KEY_ALIAS: ${{ secrets.POOYAN_KEY_ALIAS }}
          POOYAN_KEY_PASSWORD: ${{ secrets.POOYAN_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease lintRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Pooyan-TV-v0.7.5-premium-stable.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/Pooyan-TV-v0.7.5-premium-stable.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Pooyan-TV-v0.7.5-premium-stable.apk | grep -F "package: name='com.pooyan.namakadetv.tv' versionCode='45' versionName='0.7.5'"
          cd release
          sha256sum Pooyan-TV-v0.7.5-premium-stable.apk > SHA256SUMS-v0.7.5.txt
      - name: Publish v0.7.5 only (NEVER overwrite v0.7.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS-v0.7.5.txt
          gh release view v0.7.5 >/dev/null 2>&1 || gh release create v0.7.5 --target "$GITHUB_SHA" --prerelease --title 'Pooyan TV v0.7.5 — premium discovery and navigation' --notes 'Premium discovery, search filters, local recommendations, manual 90-second seek, optional settings PIN, episode tracker, home customization, and silent per-launch updater. Same permanent signing key and package ID as v0.7.0.'
          gh release upload v0.7.5 Pooyan-TV-v0.7.5-premium-stable.apk SHA256SUMS-v0.7.5.txt --clobber
