name: Pooyan TV v0.8.5 Cinema Stability Preview

on:
  push:
    branches:
      - ui/cinema-v085
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    needs: android-tv
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore optional persistent preview signing key
        shell: bash
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pooyan-preview.jks"
            echo "POOYAN_PREVIEW_SIGNING_STORE_FILE=$RUNNER_TEMP/pooyan-preview.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::No persistent preview keystore: debug-signed APK may not replace previous preview installations.'
          fi
      - name: Build, unit tests and lint
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
          POOYAN_PREVIEW_KEY_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.pooyan.namakadetv.dev083catalog' versionCode='50' versionName='0.8.5'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.5-preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.5-preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.5-Cinema-Stability-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  android-tv:
    name: Android TV (${{ matrix.display }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: 1080p
            mode: full
          - display: logical-720p
            mode: logical-720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - name: Generate synthetic HLS media for the existing player test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/debug/assets/pooyan-test
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -profile:v baseline -g 48 -c:a aac -hls_time 2 -hls_list_size 0 app/src/debug/assets/pooyan-test/index.m3u8
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POOYAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/pooyan-tv-diagnostics
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot
          pre-emulator-launch-script: bash tools/ci/capture-emulator-output.sh
          script: bash tools/ci/run-tv-instrumentation.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema085-tv-${{ matrix.display }}
          path: |
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/pooyan-tv-diagnostics/**
