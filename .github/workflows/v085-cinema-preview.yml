name: Pooyan TV v0.8.6 Cinema Stability Preview

on:
  push:
    branches:
      - ui/cinema-v086
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publish a signed GitHub pre-release for the in-app updater"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  preview-apk:
    needs: android-tv
    outputs:
      persistent_key: ${{ steps.key.outputs.persistent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore optional persistent preview signing key
        id: key
        shell: bash
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pooyan-preview.jks"
            echo "POOYAN_PREVIEW_SIGNING_STORE_FILE=$RUNNER_TEMP/pooyan-preview.jks" >> "$GITHUB_ENV"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Without the persistent signing key this artifact cannot upgrade previous previews in place.'
          fi
      - name: Build, unit tests and lint
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
          POOYAN_PREVIEW_KEY_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.pooyan.namakadetv.dev083catalog' versionCode='51' versionName='0.8.6'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.6-preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.6-preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Verify the preview signing certificate for publishable artifacts
        if: ${{ steps.key.outputs.persistent == 'true' }}
        shell: bash
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          expected=$(keytool -list -v -keystore "$POOYAN_PREVIEW_SIGNING_STORE_FILE" \
            -alias "$POOYAN_PREVIEW_KEY_ALIAS" -storepass "$POOYAN_PREVIEW_KEYSTORE_PASSWORD" \
            | awk '/SHA256:/{sub(/.*SHA256: /, ""); gsub(/:/, ""); print tolower($0); exit}')
          test -n "$actual"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > dist/SIGNING_CERT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.6-Cinema-Stability-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  publish-prerelease:
    # A GitHub Actions artifact is NOT a GitHub Release asset and is invisible to the app updater.
    needs: preview-apk
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to publish without persistent preview signing
        if: ${{ needs.preview-apk.outputs.persistent_key != 'true' }}
        run: |
          echo '::error::Cannot publish in-place updates without a fixed preview signing key. See docs/PREVIEW_SIGNING_FA.md.'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: Pooyan-TV-v0.8.6-Cinema-Stability-APK
          path: dist
      - name: Verify files before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SIGNING_CERT_SHA256.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -s dist/Pooyan-TV-v0.8.6-preview.apk
      - name: Enforce pinned signing certificate across all preview releases
        env:
          POOYAN_PREVIEW_CERT_SHA256: ${{ vars.POOYAN_PREVIEW_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$POOYAN_PREVIEW_CERT_SHA256" ]; then
            echo '::error::Set the POOYAN_PREVIEW_CERT_SHA256 repository variable to the published signing certificate fingerprint.'
            exit 1
          fi
          expected=$(printf '%s' "$POOYAN_PREVIEW_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$(head -n 1 dist/SIGNING_CERT_SHA256.txt)
          test "$actual" = "$expected" || { echo '::error::Signing certificate changed; in-place upgrade would fail'; exit 1; }
      - name: Publish pre-release v0.8.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.8.6 dist/Pooyan-TV-v0.8.6-preview.apk dist/SHA256SUMS.txt dist/SIGNING_CERT_SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Pooyan TV v0.8.6 (preview)" \
            --notes "Signed preview. In-place updates require the same package ID and signing key."

  android-tv:
    name: Android TV (${{ matrix.display }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: 1080p
            mode: full
          - display: logical-720p
            mode: logical-720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - name: Generate synthetic HLS media for the existing player test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/debug/assets/pooyan-test
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -profile:v baseline -g 48 -c:a aac -hls_time 2 -hls_list_size 0 app/src/debug/assets/pooyan-test/index.m3u8
      - name: Initialize the runner's ADB key before emulator launch
        run: adb start-server && test -s "$HOME/.android/adbkey.pub"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POOYAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/pooyan-tv-diagnostics
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -no-snapshot
          pre-emulator-launch-script: bash tools/ci/capture-emulator-output.sh
          script: bash tools/ci/run-tv-instrumentation.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema085-tv-${{ matrix.display }}
          path: |
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/pooyan-tv-diagnostics/**
