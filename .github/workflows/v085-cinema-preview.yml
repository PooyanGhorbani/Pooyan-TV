name: Pooyan TV v0.8.8 Cinema Stability Preview

on:
  push:
    branches:
      - ui/cinema-clean-v088
permissions:
  contents: read

jobs:
  preview-apk:
    outputs:
      persistent_key: ${{ steps.key.outputs.persistent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore optional persistent preview signing key
        id: key
        shell: bash
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pooyan-preview.jks"
            echo "POOYAN_PREVIEW_SIGNING_STORE_FILE=$RUNNER_TEMP/pooyan-preview.jks" >> "$GITHUB_ENV"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Without the persistent signing key this artifact cannot upgrade previous previews in place.'
          fi
      - name: Assemble debug APK
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
          POOYAN_PREVIEW_KEY_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.pooyan.namakadetv.dev083catalog' versionCode='53' versionName='0.8.8'"
          mkdir -p dist
          cp "$apk" dist/Pooyan-TV-v0.8.8-preview.apk
          (cd dist && sha256sum Pooyan-TV-v0.8.8-preview.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Verify the preview signing certificate for publishable artifacts
        if: ${{ steps.key.outputs.persistent == 'true' }}
        shell: bash
        env:
          POOYAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.POOYAN_PREVIEW_KEYSTORE_PASSWORD }}
          POOYAN_PREVIEW_KEY_ALIAS: ${{ secrets.POOYAN_PREVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          expected=$(keytool -list -v -keystore "$POOYAN_PREVIEW_SIGNING_STORE_FILE" \
            -alias "$POOYAN_PREVIEW_KEY_ALIAS" -storepass "$POOYAN_PREVIEW_KEYSTORE_PASSWORD" \
            | awk '/SHA256:/{sub(/.*SHA256: /, ""); gsub(/:/, ""); print tolower($0); exit}')
          test -n "$actual"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > dist/SIGNING_CERT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pooyan-TV-v0.8.8-Cinema-Clean-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error

