plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pooyan.namakadetv'
    compileSdk 35
    buildFeatures { buildConfig true }
    // Do not check release signing keys into the repository.
    signingConfigs {
        stable {
            if (System.getenv('POOYAN_SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('POOYAN_SIGNING_STORE_FILE'))
                storePassword System.getenv('POOYAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('POOYAN_KEY_ALIAS')
                keyPassword System.getenv('POOYAN_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.pooyan.namakadetv'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 23
        targetSdk 35
        versionCode 41
        versionName '0.7.1'
    }

    buildTypes {
        debug {
            // Side-by-side preview: never requires uninstalling the user's v0.1 app.
            applicationIdSuffix '.dev070'
        }
        release {
            // First stable line uses a new, permanent package ID. Existing preview060 remains untouched.
            applicationIdSuffix '.tv'
            if (System.getenv('POOYAN_SIGNING_STORE_FILE')) signingConfig signingConfigs.stable
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    // Media3 supports progressive MP4, HLS and DASH with native TV playback.
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'androidx.core:core:1.15.0'
}
